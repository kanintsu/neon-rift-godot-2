name: Build Afterfall Android

on:
  push:
    branches:
      - afterfall-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore project
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/afterfall.zip
          unzip -q /tmp/afterfall.zip -d .
          test -f AfterfallPlayable/project.godot
          find AfterfallPlayable -maxdepth 3 -type f -print

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: AfterfallPlayable/
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Verify APK
        shell: bash
        run: |
          echo "Build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -maxdepth 3 -type f -print
          APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" Afterfall-Buried-Days.apk
          ls -lh Afterfall-Buried-Days.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-Buried-Days-Android
          path: Afterfall-Buried-Days.apk
          if-no-files-found: error
          retention-days: 7
